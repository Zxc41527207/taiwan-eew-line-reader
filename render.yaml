services:
  - type: worker
    name: taiwan-eew-line-reader
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: WEBSOCKET_URL
        value: wss://rptes.com:443/ws/
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: taiwan-eew-line-reader-db
          property: connectionString
      - key: LINE_BROADCAST
        value: "false"
      - key: LINE_GROUP_FILE
        value: /var/data/groups.json
      - key: DEDUPE_FILE
        value: /var/data/dedupe.json

databases:
  - name: taiwan-eew-line-reader-db
    plan: free
    databaseName: taiwan_eew_line_reader
    user: taiwan_eew_line_reader
