services:
  - type: worker
    name: taiwan-eew-line-reader
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: EEW_LOCATION_CODE
        value: Taipei
      - key: POLL_INTERVAL_MS
        value: "2000"
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_TO
        sync: false